
[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -DDEPICT_FW_VERSION=\"0.1.0\"
lib_deps =
    ; Add real dependencies (AD5941 AFE, camera driver, etc.) here.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.psram = enabled
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3

; Native environment for host-side unit tests (no hardware required).
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNIT_TEST
