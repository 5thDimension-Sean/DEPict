[project]
name = "depict"
version = "0.1.0"
description = "Host-side tooling for the DEPict tri-modal microplastic sensor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DEPict contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyserial>=3.5",       # talk to the sensor node
    "scikit-learn>=1.3",   # baseline models / feature tooling
    "pydantic>=2.0",       # typed schemas for records/config
]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
ui = [
    "matplotlib>=3.7",
    "streamlit>=1.30",     # lightweight local UI
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "mypy>=1.8",
]

[project.scripts]
depict-acquire   = "depict.acquisition.cli:main"
depict-train     = "depict.ml.training.cli:main"
depict-infer     = "depict.ml.inference.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["depict*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
