name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Host software + pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "software[dev]"
      - name: Lint
        run: ruff check software datapipeline app
      - name: Test
        run: pytest software datapipeline

  firmware:
    name: Firmware (native tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Native unit tests
        run: pio test -d firmware -e native
